<!-- ko if: enabled -->
<div class="madameaiguille-newsletter">
    <label class="madameaiguille-newsletter__choice">
        <input type="checkbox" name="madameaiguille-newsletter" data-bind="checked: requested"
               aria-describedby="madameaiguille-newsletter-note"/>
        <span translate="'I would like to receive news from the workshop (optional).'"></span>
    </label>
    <p id="madameaiguille-newsletter-note"
       translate="'You will receive an email to confirm your subscription. You can unsubscribe at any time.'"></p>
</div>
