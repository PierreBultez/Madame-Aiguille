; Madame Aiguille — pool PHP-FPM dédié (copié par deploy/serveur/70-hebergement.sh dans /etc/php/8.5/fpm/pool.d/)
;
; Utilisateur système dédié, sans connexion : un défaut de Magento ne donne accès ni aux autres sites du VPS
; (www-data), ni au compte de Pierre (sudo). nginx (www-data) parle au pool par le socket.
[madame-aiguille]
user = madame-aiguille
group = madame-aiguille
listen = /run/php/php8.5-fpm-madame-aiguille.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Valeurs recommandées par Magento, propres à ce pool
php_admin_value[memory_limit] = 2G
php_admin_value[max_execution_time] = 600
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 64M
php_admin_value[session.auto_start] = 0
php_admin_value[zlib.output_compression] = 0
; Code figé entre deux déploiements : PHP-FPM est rechargé à chaque bascule (deploy/bascule.sh)
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[error_log] = /var/www/madame-aiguille/shared/var/log/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
