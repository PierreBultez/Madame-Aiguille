; Matomo — pool PHP-FPM dédié (copié par deploy/serveur/99-matomo.sh dans /etc/php/8.5/fpm/pool.d/)
;
; Utilisateur système `matomo`, sans connexion, distinct de celui de la boutique : un défaut de Matomo ne donne accès
; ni à Magento (env.php, clients, commandes) ni aux autres sites du VPS. nginx (www-data) parle au pool par le socket.
[matomo]
user = matomo
group = matomo
listen = /run/php/php8.5-fpm-matomo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Peu de trafic : processus créés à la demande
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Valeurs recommandées par Matomo pour l'interface ; l'archivage passe par la ligne de commande (cron)
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[error_log] = /var/log/matomo/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
