# Matomo — stats.madame-aiguille.fr (copié par deploy/serveur/99-matomo.sh dans /etc/nginx/sites-available/matomo)
#
# Mesure d'audience de la boutique (lot 9). nginx → PHP-FPM (pool matomo), sans Varnish : rien n'y est mis en cache.
# Durcissement repris de la configuration officielle (github.com/matomo-org/matomo-nginx) : seuls index.php,
# matomo.php et piwik.php sont exécutés ; config/, tmp/, core/, lang/, les .ini et les autres .php sont refusés.
#
# Un add_header placé dans une location annule tous ceux du niveau server : les en-têtes de sécurité sont donc
# répétés dans chaque location qui en pose (piège du lot 8, 98-cache-guide.sh).

server {
    listen 80;
    listen [::]:80;
    server_name stats.madame-aiguille.fr;

    # Redirection dans une location, pas au niveau server : Certbot ajoute à côté sa location exacte du défi
    # ACME à chaque renouvellement, et elle doit l'emporter.
    location / {
        return 301 https://stats.madame-aiguille.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.madame-aiguille.fr;

    ssl_certificate /etc/letsencrypt/live/stats.madame-aiguille.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.madame-aiguille.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/matomo;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/matomo.access.log;
    error_log  /var/log/nginx/matomo.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Seuls points d'entrée PHP : interface (index.php) et suivi (matomo.php, piwik.php pour les anciens appels)
    location ~ ^/(index|matomo|piwik)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.5-fpm-matomo.sock;
    }

    # Tout autre script PHP
    location ~* \.php$ {
        return 403;
    }

    # Configuration, fichiers temporaires, code, traductions, tests, console (script PHP sans extension), fichiers
    # .ini et fichiers cachés
    location ~ ^/(config|tmp|core|lang|tests)(/|$) {
        return 403;
    }
    location = /console {
        return 403;
    }
    location ~* \.ini$ {
        return 403;
    }
    location ~ /\. {
        return 403;
    }

    # Ressources statiques (dont matomo.js et les images des extensions), avant le refus de libs/, vendor/…
    location ~* \.(gif|ico|jpg|jpeg|png|webp|svg|js|css|ttf|eot|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(libs|vendor|plugins|misc|node_modules)(/|$) {
        return 403;
    }

    # Notes de version et licence lisibles, rien d'exécutable
    location ~ /(.*\.md|LEGALNOTICE|LICENSE)$ {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
