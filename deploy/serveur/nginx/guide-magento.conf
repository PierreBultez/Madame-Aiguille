# Guide Madame Aiguille — guide-magento.pierrebultez.com (copié par deploy/serveur/96-guide-magento.sh)
#
# Site statique VitePress (docs-site/), publié par docs-site/publier.sh dans /var/www/guide-magento.
# On ne déclare que l'écoute en clair : Certbot ajoute lui-même le bloc TLS et la redirection vers HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name guide-magento.pierrebultez.com;

    root /var/www/guide-magento;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/guide-magento.access.log;
    error_log  /var/log/nginx/guide-magento.error.log;

    # Documentation interne : pas d'indexation (doublé par la balise robots des pages)
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Pages, favicon et recherche : même adresse d'une publication à l'autre, le navigateur revérifie à chaque
    # visite (réponse 304 si rien n'a changé). Les blocs /assets/ et /guide-back-office/ ont leurs propres règles.
    add_header Cache-Control "no-cache" always;

    # Adresses propres de VitePress (cleanUrls) : /guide/se-connecter sert /guide/se-connecter.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Fichiers empreintés par le build : leur nom change à chaque publication
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    # Captures du guide : même nom d'une publication à l'autre, cache court
    location /guide-back-office/ {
        expires 1h;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }
}
