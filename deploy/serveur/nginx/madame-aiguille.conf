# Madame Aiguille — nginx (copié par deploy/serveur/70-hebergement.sh dans /etc/nginx/sites-available/)
#
# Chaîne : 443 (TLS) → Varnish 127.0.0.1:6081 → nginx 127.0.0.1:8080 → PHP-FPM (pool madame-aiguille).
# Domaine canonique madame-aiguille.fr ; www et HTTP redirigés en 301. Un seul certificat pour les deux noms.

# Nom imposé par nginx.conf.sample de Magento
upstream fastcgi_backend {
    server unix:/run/php/php8.5-fpm-madame-aiguille.sock;
}

# HTTP → HTTPS canonique (certbot --nginx gère lui-même le défi ACME)
server {
    listen 80;
    listen [::]:80;
    server_name madame-aiguille.fr www.madame-aiguille.fr;
    return 301 https://madame-aiguille.fr$request_uri;
}

# www → domaine nu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.madame-aiguille.fr;

    ssl_certificate /etc/letsencrypt/live/madame-aiguille.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madame-aiguille.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://madame-aiguille.fr$request_uri;
}

# Terminaison TLS devant Varnish
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name madame-aiguille.fr;

    ssl_certificate /etc/letsencrypt/live/madame-aiguille.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madame-aiguille.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Avant l'ouverture des ventes : aucune indexation (doublé par robots NOINDEX,NOFOLLOW dans Magento).
    # À retirer le jour de l'ouverture, avec le réglage robots de l'administration.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 64m;
    access_log /var/log/nginx/madame-aiguille.access.log;
    error_log /var/log/nginx/madame-aiguille.error.log;

    # Hérités par toutes les locations, y compris celle de l'administration
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    # En-têtes volumineux de Magento (étiquettes de cache, cookies)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 600s;

    # Administration : IP autorisées OU mot de passe HTTP (deploy/serveur/90-acces-admin.sh). Fichier propre au
    # serveur, hors dépôt : il contient le chemin de l'administration. Sans lui, rien n'est restreint.
    include /etc/nginx/snippets/madame-aiguille-admin*.conf;

    location / {
        proxy_pass http://127.0.0.1:6081;
    }
}

# Backend de Varnish : configuration officielle de Magento, version en ligne via le lien current
server {
    listen 127.0.0.1:8080;
    server_name madame-aiguille.fr;
    set $MAGE_ROOT /var/www/madame-aiguille/current;
    include /var/www/madame-aiguille/current/nginx.conf.sample;
}
